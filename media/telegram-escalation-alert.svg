<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2AABEE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229ED9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="580" fill="#1a1a2e"/>
  
  <!-- Phone body -->
  <rect x="150" y="30" width="500" height="520" rx="36" fill="#17212B" stroke="#252f3c" stroke-width="2"/>
  
  <!-- Status bar -->
  <text x="180" y="55" fill="#6C7883" font-size="11">9:41</text>
  
  <!-- Chat header -->
  <rect x="150" y="68" width="500" height="50" fill="#1F2C38"/>
  <text x="400" y="95" fill="white" font-size="14" font-weight="600" text-anchor="middle">SMB Forge Bot</text>
  <text x="400" y="110" fill="#6C7883" font-size="10" text-anchor="middle">bot</text>
  
  <!-- Escalation alert card -->
  <rect x="180" y="140" width="440" height="300" rx="12" fill="#242F3D" stroke="#3E546A" stroke-width="1"/>
  
  <!-- Header bar -->
  <rect x="180" y="140" width="440" height="40" rx="12" fill="#E53935"/>
  <rect x="180" y="168" width="440" height="12" fill="#E53935"/>
  <text x="210" y="165" fill="white" font-size="13" font-weight="700">⚠️ CUSTOMER ESCALATION REQUIRED</text>
  
  <!-- Content -->
  <rect x="200" y="195" width="400" height="1" fill="#3E546A"/>
  
  <text x="200" y="220" fill="#6C7883" font-size="12" font-weight="600">Customer</text>
  <text x="200" y="240" fill="white" font-size="14">John Smith</text>
  
  <text x="200" y="268" fill="#6C7883" font-size="12" font-weight="600">Phone</text>
  <text x="200" y="288" fill="#2AABEE" font-size="14" text-decoration="underline">(408) 334-9423</text>
  
  <text x="200" y="316" fill="#6C7883" font-size="12" font-weight="600">Reason</text>
  <text x="200" y="336" fill="white" font-size="14">After-hours emergency — pipe burst</text>
  
  <rect x="200" y="355" width="400" height="1" fill="#3E546A"/>
  
  <text x="200" y="378" fill="#6C7883" font-size="12" font-weight="600">Recent conversation</text>
  <text x="200" y="398" fill="#a0a0c0" font-size="12">Customer: 3</text>
  <text x="200" y="416" fill="#a0a0c0" font-size="12">Agent: Let me connect you with our</text>
  <text x="200" y="432" fill="#a0a0c0" font-size="12">team. They'll reach out to you shortly.</text>
  
  <!-- Action buttons -->
  <rect x="180" y="465" width="210" height="40" rx="20" fill="none" stroke="#2AABEE" stroke-width="1.5"/>
  <text x="285" y="491" fill="#2AABEE" font-size="13" font-weight="600" text-anchor="middle">📞 Call Customer</text>
  
  <rect x="410" y="465" width="210" height="40" rx="20" fill="#2AABEE"/>
  <text x="515" y="491" fill="white" font-size="13" font-weight="600" text-anchor="middle">✓ Acknowledge</text>

  <!-- Owner notification dot -->
  <circle cx="630" cy="95" r="8" fill="#E53935"/>
  <text x="630" y="98" fill="white" font-size="9" font-weight="700" text-anchor="middle">1</text>
</svg>
