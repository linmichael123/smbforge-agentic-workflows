<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2AABEE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229ED9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43A047;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="#1a1a2e"/>
  
  <!-- Phone body -->
  <rect x="150" y="30" width="500" height="440" rx="36" fill="#17212B" stroke="#252f3c" stroke-width="2"/>
  
  <!-- Status bar -->
  <text x="180" y="55" fill="#6C7883" font-size="11">9:41</text>
  
  <!-- Chat header -->
  <rect x="150" y="68" width="500" height="50" fill="#1F2C38"/>
  <text x="400" y="95" fill="white" font-size="14" font-weight="600" text-anchor="middle">SMB Forge Bot</text>
  <text x="400" y="110" fill="#6C7883" font-size="10" text-anchor="middle">bot</text>
  
  <!-- Booking notification card -->
  <rect x="180" y="140" width="440" height="250" rx="12" fill="#242F3D" stroke="#3E546A" stroke-width="1"/>
  
  <rect x="180" y="140" width="440" height="40" rx="12" fill="#43A047"/>
  <rect x="180" y="168" width="440" height="12" fill="#43A047"/>
  <text x="210" y="165" fill="white" font-size="13" font-weight="700">📅 NEW BOOKING</text>
  
  <rect x="200" y="195" width="400" height="1" fill="#3E546A"/>
  
  <text x="200" y="220" fill="#6C7883" font-size="12" font-weight="600">Customer</text>
  <text x="200" y="240" fill="white" font-size="14">Jane Doe</text>
  
  <text x="200" y="268" fill="#6C7883" font-size="12" font-weight="600">Phone</text>
  <text x="200" y="288" fill="#2AABEE" font-size="14">(714) 555-1234</text>
  
  <text x="200" y="316" fill="#6C7883" font-size="12" font-weight="600">Service</text>
  <text x="200" y="336" fill="white" font-size="14">Plumbing — Emergency pipe repair</text>
  
  <text x="200" y="364" fill="#6C7883" font-size="12" font-weight="600">Time</text>
  <text x="200" y="384" fill="white" font-size="14">Today, 2:00 PM (30 min)</text>
  
  <!-- Divider -->
  <rect x="200" y="398" width="400" height="1" fill="#3E546A"/>
  
  <text x="200" y="418" fill="#a0a0c0" font-size="11">Booked via: SMS (customer-initiated)</text>
  <text x="200" y="436" fill="#a0a0c0" font-size="11">Automatically synced to Google Calendar</text>

  <!-- Action buttons -->
  <rect x="180" y="455" width="145" height="36" rx="18" fill="none" stroke="#43A047" stroke-width="1.5"/>
  <text x="253" y="478" fill="#43A047" font-size="12" font-weight="600" text-anchor="middle">✓ Approve</text>
  
  <rect x="340" y="455" width="145" height="36" rx="18" fill="none" stroke="#FB8C00" stroke-width="1.5"/>
  <text x="413" y="478" fill="#FB8C00" font-size="12" font-weight="600" text-anchor="middle">✎ Edit</text>

  <rect x="500" y="455" width="145" height="36" rx="18" fill="none" stroke="#E53935" stroke-width="1.5"/>
  <text x="573" y="478" fill="#E53935" font-size="12" font-weight="600" text-anchor="middle">✕ Decline</text>
</svg>
