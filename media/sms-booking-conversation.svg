<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Phone body -->
  <rect x="200" y="20" width="400" height="640" rx="36" fill="#0f0f23" stroke="#2a2a4a" stroke-width="2"/>
  
  <!-- Status bar -->
  <text x="230" y="50" fill="#8888aa" font-size="12">9:41</text>
  <text x="540" y="50" fill="#8888aa" font-size="12">📶 🔋 100%</text>
  
  <!-- Contact header -->
  <circle cx="400" cy="95" r="24" fill="url(#grad)"/>
  <text x="400" y="100" fill="white" font-size="18" font-weight="bold" text-anchor="middle">SF</text>
  <text x="400" y="130" fill="#e0e0ff" font-size="15" font-weight="600" text-anchor="middle">SMB Forge</text>
  <circle cx="370" cy="134" r="3" fill="#66bb6a"/>
  <text x="377" y="137" fill="#66bb6a" font-size="11"> Online</text>
  
  <!-- Divider -->
  <line x1="230" y1="150" x2="570" y2="150" stroke="#2a2a4a" stroke-width="1"/>
  
  <!-- Messages -->
  <!-- User message 1 -->
  <rect x="260" y="165" width="280" height="38" rx="18" fill="url(#grad)"/>
  <rect x="500" y="165" width="40" height="38" rx="0" fill="url(#grad)"/>
  <text x="275" y="190" fill="white" font-size="14">I need an emergency plumber!</text>
  
  <!-- Bot message 1 - escalation -->
  <rect x="230" y="218" width="320" height="72" rx="18" fill="#2a2a4a"/>
  <rect x="230" y="218" width="40" height="72" rx="0" fill="#2a2a4a"/>
  <text x="248" y="237" fill="#ff5252" font-size="11" font-weight="700">ESCALATED TO OWNER</text>
  <text x="248" y="255" fill="#e0e0ff" font-size="13">I understand this is urgent.</text>
  <text x="248" y="273" fill="#e0e0ff" font-size="13">Let me connect you with our team.</text>
  
  <!-- Timestamp -->
  <text x="400" y="305" fill="#6666aa" font-size="10" text-anchor="middle">They'll reach out to you shortly. — May 12, 2:19 PM</text>
  
  <!-- Divider -->
  <line x1="300" y1="320" x2="500" y2="320" stroke="#6666aa" stroke-width="0.5"/>
  <text x="400" y="336" fill="#6666aa" font-size="11" text-anchor="middle">▼ Demo Booking (earlier today)</text>
  
  <!-- User message 2 -->
  <rect x="280" y="352" width="240" height="38" rx="18" fill="url(#grad)"/>
  <rect x="480" y="352" width="40" height="38" rx="0" fill="url(#grad)"/>
  <text x="295" y="377" fill="white" font-size="14">Hi, I'd like to book a demo</text>
  
  <!-- Bot message 2 -->
  <rect x="230" y="405" width="310" height="54" rx="18" fill="#2a2a4a"/>
  <rect x="230" y="405" width="40" height="54" rx="0" fill="#2a2a4a"/>
  <text x="248" y="425" fill="#e0e0ff" font-size="13">Great! Here's what's available:</text>
  <text x="248" y="443" fill="#a0a0cc" font-size="12">Tomorrow (Wed): 9 AM, 10:30 AM, 1 PM, 3 PM</text>
  
  <!-- User message 3 -->
  <rect x="280" y="474" width="200" height="38" rx="18" fill="url(#grad)"/>
  <rect x="440" y="474" width="40" height="38" rx="0" fill="url(#grad)"/>
  <text x="295" y="499" fill="white" font-size="14">10:30 AM works</text>
  
  <!-- Bot message 3 -->
  <rect x="230" y="527" width="340" height="54" rx="18" fill="#2a2a4a"/>
  <rect x="230" y="527" width="40" height="54" rx="0" fill="#2a2a4a"/>
  <text x="248" y="547" fill="#e0e0ff" font-size="13">To book, I'll need your name and</text>
  <text x="248" y="565" fill="#e0e0ff" font-size="13">email. What's your full name?</text>
  
  <!-- User message 4 -->
  <rect x="280" y="596" width="200" height="38" rx="18" fill="url(#grad)"/>
  <rect x="440" y="596" width="40" height="38" rx="0" fill="url(#grad)"/>
  <text x="295" y="621" fill="white" font-size="14">Michael Lin</text>
</svg>
